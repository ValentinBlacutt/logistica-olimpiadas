services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "TuPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"TuPassword123!\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  authservice:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    container_name: authservice
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=AuthDb;User=sa;Password=TuPassword123!;TrustServerCertificate=True"
    ports:
      - "5001:8080"

  pedidosservice:
    build:
      context: .
      dockerfile: src/PedidosService/Dockerfile
    container_name: pedidosservice
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=PedidosDb;User=sa;Password=TuPassword123!;TrustServerCertificate=True"
      Ia__ApiKey: ""
      Ia__Modelo: "openai/gpt-oss-20b"
    ports:
      - "5002:8080"

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    container_name: gateway
    depends_on:
      - authservice
      - pedidosservice
    ports:
      - "5080:8080"

volumes:
  sqlserver_data: